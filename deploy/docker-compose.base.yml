# The measured configuration for the base enclave, when it runs alone in its own CVM
# (`teeism enclaves up --chain base`). By default it runs in the shared CVM instead, whose
# docker-compose.all.yml is generated from this file's service block.
#
# Serves the Base Sepolia origin: blocks its sequencer signed. One Celestia-side ISM pins it.
#
# This file's hash becomes `compose-hash` in RTMR3, and the ISM pins that value, so this file,
# including the image digest below, is what an ISM ultimately commits to. Pinned by digest: a
# tag can be repointed, and a repointed tag would mean a different binary under the same
# measurement. Written by `teeism images`.
services:
  base:
    image: ghcr.io/jonas089/tee-node@sha256:063a255682a1e64d92396828b3a5ae2efb9348bae2d36fbc11f90b717c1c657c
    ports:
      - "8082:8080"
    volumes:
      # The only thing the enclave talks to, and it is local. No data volume: the enclave is
      # stateless, so there is nothing to persist and nothing to seal.
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - RUST_LOG=info
