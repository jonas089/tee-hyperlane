<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TEE Relayer</title>
<style>
  :root {
    --ink: #131313; --muted: #7d7d7d; --line: #e8e8e8;
    --bg: #f4f4f5; --surface: #fff; --field: #f4f4f6; --accent: #fc42a0;
    --track: #e6e6ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f5; --muted: #9b9b9b; --line: #2a2a2e;
      --bg: #0d0d0f; --surface: #18181b; --field: #202024; --track: #2c2c31;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 780px; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1.1rem; margin: 0 0 1.25rem; letter-spacing: -0.01em; }
  .updated { color: var(--muted); font-size: 0.8rem; font-variant-numeric: tabular-nums; }

  .route {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 1.1rem 1.15rem; margin-bottom: 0.9rem;
    opacity: 0; transform: translateY(6px);
    animation: rise 0.45s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
  }
  @keyframes rise { to { opacity: 1; transform: none; } }

  .route h2 {
    font-size: 0.98rem; margin: 0; text-transform: capitalize; font-weight: 600;
  }
  .domains { color: var(--muted); font-size: 0.78rem; margin-top: 0.1rem; }

  /* How far the ISM has caught up with its origin, as a proportion of the gap it started
     from. A bar reads faster than two block numbers. */
  .catchup { margin: 0.9rem 0 0.2rem; }
  .catchup-top {
    display: flex; justify-content: space-between;
    font-size: 0.78rem; color: var(--muted); margin-bottom: 0.35rem;
  }
  .bar { height: 5px; border-radius: 999px; background: var(--track); overflow: hidden; }
  .bar span {
    display: block; height: 100%; border-radius: 999px; background: var(--accent);
    width: 0; transition: width 0.9s cubic-bezier(0.22, 0.61, 0.36, 1);
  }

  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 0.7rem; margin-top: 0.9rem;
  }
  .cell { background: var(--field); border-radius: 14px; padding: 0.65rem 0.8rem; }
  .cell span { display: block; color: var(--muted); font-size: 0.74rem; margin-bottom: 0.1rem; }
  .cell strong {
    font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere;
    font-variant-numeric: tabular-nums;
  }

  /* Proving has no progress to report - it is one long CPU burn - so the bar sweeps rather
     than pretending to measure. */
  .working { position: relative; overflow: hidden; }
  .working::after {
    content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 40%;
    background: var(--accent); border-radius: 999px;
    animation: sweep 1.8s ease-in-out infinite;
  }
  @keyframes sweep {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(350%); }
  }

  .msgs { margin-top: 0.8rem; font-size: 0.8rem; color: var(--muted); }
  .msgs code {
    display: block; overflow-wrap: anywhere; color: var(--ink); font-size: 0.76rem;
    padding: 0.15rem 0;
  }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .err { color: #b42318; font-size: 0.84rem; margin-top: 0.6rem; }
  .empty { color: var(--muted); }
</style>
<main>
  <header>
    <h1>TEE Relayer</h1>
    <span class="updated" id="updated"></span>
  </header>
  <div id="routes"></div>
</main>
<script>
  const short = (s, k = 10) =>
    !s ? "—" : s.length <= k * 2 ? s : s.slice(0, k + 2) + "…" + s.slice(-k);
  const plural = (n) => (n === 1 ? "" : "s");
  const num = (n) => (n == null ? "—" : n.toLocaleString());

  function batch(b) {
    if (!b) return "—";
    return `block ${num(b.height)} · ${b.messages.length} message${plural(b.messages.length)}`;
  }

  // Remember the largest gap each route has shown, so the bar has something to fill against.
  const widest = {};

  function catchup(r) {
    if (r.originHead == null || r.height == null) return null;
    const behind = Math.max(0, r.originHead - r.height);
    widest[r.name] = Math.max(widest[r.name] || 0, behind, 1);
    return { behind, percent: Math.round((1 - behind / widest[r.name]) * 100) };
  }

  function draw(routes) {
    document.getElementById("routes").innerHTML = routes
      .map((r, i) => {
        const c = catchup(r);
        return `
      <section class="route" style="animation-delay:${i * 60}ms">
        <h2>${r.name.replace(/-/g, " ")}</h2>
        <div class="domains">domain ${r.origin} &rarr; ${r.destination}</div>

        ${c ? `<div class="catchup">
          <div class="catchup-top">
            <span>caught up to ${num(r.height)}</span>
            <span>${c.behind === 0 ? "at head" : num(c.behind) + " blocks behind"}</span>
          </div>
          <div class="bar"><span data-fill="${c.percent}"></span></div>
        </div>` : ""}

        <div class="grid">
          <div class="cell"><span>Origin head</span><strong>${num(r.originHead)}</strong></div>
          <div class="cell"><span>Last proven</span><strong>${batch(r.batches[0])}</strong></div>
          <div class="cell ${r.proving ? "working" : ""}">
            <span>${r.proving ? "Proving" : "Prover"}</span>
            <strong>${r.proving ? batch(r.proving) : "nothing new to attest"}</strong>
          </div>
          <div class="cell"><span>State root</span><strong><code>${short(r.stateRoot)}</code></strong></div>
        </div>

        ${r.proving && r.proving.messages.length
          ? `<div class="msgs">In this batch:${r.proving.messages
              .map((m) => `<code>${m}</code>`)
              .join("")}</div>`
          : ""}
        ${r.error ? `<p class="err">${r.error}</p>` : ""}
      </section>`;
      })
      .join("") || `<p class="empty">No routes configured.</p>`;

    // Set the widths after layout so the transition actually runs.
    requestAnimationFrame(() => {
      document.querySelectorAll(".bar span").forEach((el) => {
        el.style.width = el.dataset.fill + "%";
      });
    });
  }

  async function refresh() {
    try {
      draw(await (await fetch("/api/status")).json());
      document.getElementById("updated").textContent =
        "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    } catch (e) {
      document.getElementById("updated").textContent = "unreachable";
    }
  }

  refresh();
  setInterval(refresh, 15000);
</script>
