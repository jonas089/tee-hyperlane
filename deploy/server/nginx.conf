# The bridge UI. The attestation API is proxied under the same origin so the browser needs
# no CORS; it is also reachable directly on :3001 for anything that wants the raw JSON.

server {
    listen 3000;
    server_name _;

    root /opt/bridge-app;
    index index.html;

    # Vite build: hashed assets, so they can be cached hard; index.html cannot.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
