# SP1 guest programs. Kept out of the host workspace because they build for
# riscv32im-succinct-zkvm-elf, and because the precompile patches below must apply to the
# whole guest dependency graph - including dcap-qvl's p256 and sha2, which is where nearly
# all of the proving cost lives.
[workspace]
resolver = "2"
members = ["state-transition", "state-membership", "bench-attestation"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
sp1-zkvm = "=5.2.2"
tee-attestation = { path = "../tee-attestation" }
serde_json = "1.0"
bincode = "1.3.3"
# sp1-zkvm 5.2.2 targets getrandom 0.3.3; 0.3.4 restructured `backends` and no longer
# compiles for the zkvm target.
getrandom = "=0.3.3"

# SP1 5.0.0 precompile patches. p256 is what makes DCAP's ECDSA verifications affordable;
# sha2 covers the quote and certificate hashing. Note SHA-384 (the RTMR replay) is not
# accelerated, so keep the event log short.
[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", tag = "patch-sha2-0.10.9-sp1-4.0.0", package = "sha2" }
p256 = { git = "https://github.com/sp1-patches/elliptic-curves", tag = "patch-p256-13.2-sp1-5.0.0" }

[profile.release]
opt-level = 3
lto = true
