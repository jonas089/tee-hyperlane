# The bridge UI. The attestation API is proxied under the same origin so the browser needs
# no CORS; it is also reachable directly on :3001 for anything that wants the raw JSON.

server {
    listen 3000;
    server_name _;

    root /opt/bridge-app;
    index index.html;

    # Vite build: hashed assets, so they can be cached hard; index.html cannot.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mocha's public REST answers correctly but sends no Access-Control-Allow-Origin, so a
    # browser throws the response away. Proxying it here makes it same-origin.
    location /celestia/ {
        proxy_pass https://api-mocha.pops.one/;
        proxy_ssl_server_name on;
        proxy_set_header Host api-mocha.pops.one;
        proxy_read_timeout 30s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Single-page app: unknown paths are routes, not missing files.
    #
    # index.html must never be cached. It names the hashed bundle, so a stale copy pins the
    # browser to an old build - which is exactly how a fixed bug appears not to be fixed.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, must-revalidate";
    }
}
