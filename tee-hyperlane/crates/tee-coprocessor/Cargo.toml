[package]
name = "tee-coprocessor"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
hyperlane-types.workspace = true
tree_hash = "0.10"
celestia-types.workspace = true
tee-node.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-rlp.workspace = true

anyhow.workspace = true
base64.workspace = true
clap = { version = "4", features = ["derive"] }
hex.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "process"] }
async-trait = "0.1"
tempfile = "3"
toml = "0.8"
tendermint.workspace = true
tendermint-rpc.workspace = true
reqwest.workspace = true
dcap-qvl = { version = "=0.5.3", default-features = false, features = ["std", "rustcrypto", "default-x509", "report"] }
tendermint-light-client-verifier.workspace = true
helios-consensus-core.workspace = true
axum.workspace = true
tracing.workspace = true
# Base's sequencer signs blocks only on the OP Stack p2p network: discv5 finds peers, gossipsub
# carries the blocks, snappy compresses them.
libp2p = { version = "0.56", default-features = false, features = ["tokio", "tcp", "dns", "noise", "yamux", "gossipsub", "identify", "ping", "secp256k1", "macros"] }
discv5 = "0.12"
enr = { version = "0.14", features = ["k256"] }
snap = "1"
futures = "0.3"
# Arbitrum's sequencer feed.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tracing-subscriber.workspace = true

[[bin]]
name = "tee-hyperlane"
path = "src/main.rs"

[dev-dependencies]
filetime = "0.2"
