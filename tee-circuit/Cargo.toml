[workspace]
resolver = "2"
members = ["crates/tee-attestation", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tee-attestation = { path = "crates/tee-attestation" }

sha2 = "0.10.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hex = "0.4"
thiserror = "1.0"
anyhow = "1.0"
scale = { package = "parity-scale-codec", version = "3.7", default-features = false, features = ["derive", "std"] }

# Newest dcap-qvl that still uses p256 0.13 / sha2 0.10 - the versions SP1 5.0.0's
# precompile patches cover. 0.6.x moves to p256 0.14 / sha2 0.11 and would silently
# fall back to software ECDSA and SHA-256 inside the zkVM.
dcap-qvl = { version = "=0.5.3", default-features = false, features = ["std", "rustcrypto", "default-x509"] }
