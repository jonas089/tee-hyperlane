# The measured configuration for the eden enclave, when it runs alone in its own CVM
# (`30-enclave-up.sh --eden`). By default it runs in the shared CVM instead, whose
# docker-compose.all.yml is generated from this file's service block.
#
# Serves the Eden origin: headers its sequencer signed, read out of mocha blocks. One Celestia-side ISM pins it.
#
# This file's hash becomes `compose-hash` in RTMR3, and the ISM pins that value, so this file,
# including the image digest below, is what an ISM ultimately commits to. Pinned by digest: a
# tag can be repointed, and a repointed tag would mean a different binary under the same
# measurement. Written by devnet/scripts/25-images.sh.
services:
  eden:
    image: ghcr.io/jonas089/tee-node@sha256:f6a3a0f1219302b9384771ce3b4b6d252e438fb27b26238b0e31a4a2b81e9dfd
    ports:
      - "8084:8080"
    volumes:
      # The only thing the enclave talks to, and it is local. No data volume: the enclave is
      # stateless, so there is nothing to persist and nothing to seal.
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - RUST_LOG=info
