[package]
name = "tee-node"
version.workspace = true
edition.workspace = true
license.workspace = true

# One image per origin chain, so a change to one chain re-deploys only that chain's enclave.
#
# `default` builds all of them, which is what the tests and the devnet use. Each image enables
# one.
[features]
default = ["celestia", "ethereum", "base", "arbitrum", "eden"]
celestia = ["dep:tendermint", "dep:tendermint-light-client-verifier", "dep:celestia-types", "dep:ed25519-dalek", "dep:ics23", "dep:prost"]
ethereum = ["dep:helios-consensus-core", "dep:ssz_types", "dep:ethereum_ssz", "dep:tree_hash"]
base = ["alloy-primitives/k256"]
arbitrum = ["alloy-primitives/k256"]
# Eden's headers are read out of Celestia blocks, so its light client comes too.
eden = ["celestia"]

[dependencies]
hyperlane-types.workspace = true

alloy-primitives.workspace = true
alloy-rlp.workspace = true
alloy-trie.workspace = true
anyhow.workspace = true
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
ics23 = { workspace = true, optional = true }
celestia-types = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
helios-consensus-core = { workspace = true, optional = true }
tendermint = { workspace = true, optional = true }
tendermint-light-client-verifier = { workspace = true, optional = true }
# Must match helios-consensus-core exactly, or its derived traits are not ours.
ssz_types = { version = "0.11", optional = true }
ethereum_ssz = { version = "0.9", optional = true }
tree_hash = { version = "0.10", optional = true }
axum.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
hyper.workspace = true
hyper-util.workspace = true
hyperlocal.workspace = true
http-body-util.workspace = true

[dev-dependencies]
serde_json.workspace = true
base64.workspace = true
hex.workspace = true

[[bin]]
name = "tee-node"
path = "src/main.rs"
