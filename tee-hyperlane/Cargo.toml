[workspace]
resolver = "2"
members = ["crates/hyperlane-types", "crates/tee-node", "crates/tee-coprocessor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
hyperlane-types = { path = "crates/hyperlane-types" }
tee-attestation = { path = "../tee-circuit/crates/tee-attestation" }
tee-node = { path = "crates/tee-node" }
tee-coprocessor = { path = "crates/tee-coprocessor" }

alloy-primitives = { version = "1.3", features = ["serde"] }
anyhow = "1.0"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
thiserror = "1.0"
tiny-keccak = { version = "2.0", features = ["keccak"] }
alloy-rlp = "0.3"
alloy-trie = { version = "0.9", features = ["serde", "ethereum"] }
tracing = "0.1"
tracing-subscriber = "0.3"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
hyperlocal = "0.9"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
ics23 = { version = "0.12", features = ["host-functions"] }
prost = "0.13"
base64 = "0.22"

# Ethereum consensus light client: pure verify_update/apply_update over a LightClientStore,
# no networking, which is exactly what a stateless enclave needs. Pinned by commit because
# helios publishes only nightly tags.
helios-consensus-core = { git = "https://github.com/a16z/helios", rev = "43a8c9f3cdda41a6f383c4db41d9a83f102638b1" }

# Celestia consensus light client.
tendermint = { version = "0.40", default-features = false }
tendermint-light-client-verifier = { version = "0.40", default-features = false, features = ["rust-crypto"] }
tendermint-proto = "0.40"
tendermint-rpc = { version = "0.40", features = ["http-client"] }
