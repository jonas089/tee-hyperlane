<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TEE Relayer</title>
<style>
  :root {
    --ink: #131313; --muted: #7d7d7d; --line: #e8e8e8;
    --bg: #f4f4f5; --surface: #fff; --field: #f9f9f9; --accent: #fc42a0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f5; --muted: #9b9b9b; --line: #2a2a2e;
      --bg: #0d0d0f; --surface: #18181b; --field: #202024;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; padding: 1.25rem 1rem 4rem; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; }
  h1 { font-size: 1.05rem; margin: 0 0 1rem; }
  .updated { color: var(--muted); font-size: 0.8rem; }
  .route {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; padding: 1rem; margin-bottom: 0.85rem;
  }
  .route h2 { font-size: 0.95rem; margin: 0; text-transform: capitalize; }
  .domains { color: var(--muted); font-size: 0.8rem; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 0.75rem; margin-top: 0.85rem;
  }
  .cell { background: var(--field); border-radius: 14px; padding: 0.6rem 0.75rem; }
  .cell span { display: block; color: var(--muted); font-size: 0.75rem; }
  .cell strong { font-weight: 600; font-size: 0.95rem; overflow-wrap: anywhere; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.85rem; }
  .msgs { margin-top: 0.75rem; font-size: 0.82rem; color: var(--muted); }
  .msgs code { display: block; overflow-wrap: anywhere; color: var(--ink); }
  .err { color: #b42318; font-size: 0.85rem; margin-top: 0.5rem; }
</style>
<main>
  <header>
    <h1>TEE Relayer</h1>
    <span class="updated" id="updated"></span>
  </header>
  <div id="routes"></div>
</main>
<script>
  const short = (s, k = 10) => (!s ? "—" : s.length <= k * 2 ? s : s.slice(0, k + 2) + "…" + s.slice(-k));
  const plural = (n) => (n === 1 ? "" : "s");

  function batch(b) {
    if (!b) return "—";
    return `block ${b.height}, ${b.messages.length} message${plural(b.messages.length)}`;
  }

  function head(r) {
    if (r.originHead == null) return "—";
    const behind = r.height == null ? null : r.originHead - r.height;
    return behind == null ? `${r.originHead}` : `${r.originHead} (${behind} ahead)`;
  }

  // A route with nothing staged is not stalled - it has attested everything dispatched so
  // far. Saying so is the difference between "working" and "broken" at a glance.
  function proving(r) {
    if (r.proving) return batch(r.proving);
    return "nothing new to attest";
  }

  async function draw() {
    const routes = await (await fetch("/api/status")).json();
    document.getElementById("routes").innerHTML = routes.map((r) => `
      <section class="route">
        <h2>${r.name.replace(/-/g, " ")}</h2>
        <div class="domains">domain ${r.origin} &rarr; ${r.destination}</div>
        <div class="grid">
          <div class="cell"><span>Trusted origin block</span><strong>${r.height ?? "—"}</strong></div>
          <div class="cell"><span>Origin head</span><strong>${head(r)}</strong></div>
          <div class="cell"><span>Last proven</span><strong>${batch(r.batches[0])}</strong></div>
          <div class="cell"><span>Proving now</span><strong>${proving(r)}</strong></div>
          <div class="cell"><span>State root</span><strong><code>${short(r.stateRoot)}</code></strong></div>
        </div>
        ${r.proving && r.proving.messages.length
          ? `<div class="msgs">In this batch:${r.proving.messages.map((m) => `<code>${m}</code>`).join("")}</div>`
          : ""}
        ${r.error ? `<p class="err">${r.error}</p>` : ""}
      </section>`).join("");
    document.getElementById("updated").textContent =
      "updated " + new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  }

  draw();
  setInterval(draw, 15000);
</script>
